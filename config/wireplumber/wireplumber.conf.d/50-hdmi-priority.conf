monitor.alsa.rules = [
  {
    matches = [
      {
        "device.name" = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        "api.alsa.use-acp" = false
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "~alsa_output.pci-0000_01_00.1.*"
      }
    ]
    actions = {
      update-props = {
        "audio.channels" = 2
        "audio.position" = [ "FL", "FR" ]
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "alsa_output.pci-0000_01_00.1.playback.7.0"
      }
    ]
    actions = {
      update-props = {
        "node.description" = "Samsung Monitor (HDMI)"
        "node.nick" = "Samsung Monitor"
        "priority.session" = 900
        "priority.driver" = 900
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "alsa_output.pci-0000_01_00.1.playback.3.0"
      }
    ]
    actions = {
      update-props = {
        "node.description" = "Sony TV (HDMI)"
        "node.nick" = "Sony TV"
        "priority.session" = 800
        "priority.driver" = 800
      }
    }
  },
  {
    matches = [
      {
        "device.name" = "alsa_card.pci-0000_00_1b.0"
      }
    ]
    actions = {
      update-props = {
        "device.disabled" = true
      }
    }
  },
  {
    matches = [
      {
        "device.name" = "alsa_card.pci-0000_00_03.0"
      }
    ]
    actions = {
      update-props = {
        "device.disabled" = true
      }
    }
  },
  {
    matches = [
      {
        "node.name" = "~alsa_output.usb-KTMICRO_FDUCE_M160.*"
      }
    ]
    actions = {
      update-props = {
        "node.disabled" = true
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        "node.name" = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        "priority.session" = 2500
        "priority.driver" = 2500
      }
    }
  }
]

