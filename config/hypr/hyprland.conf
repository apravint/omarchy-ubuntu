# ==============================================================================
# Omarchy Hyprland Configuration (Quattro Edition)
# ==============================================================================

# Monitor setup (Auto-detect)
monitor=,preferred,auto,1

# Autostart essential Daemons & Omarchy System Services
exec-once = waybar
exec-once = swaybg -i ~/.local/state/omarchy/current/background -m fill
exec-once = mako
exec-once = ~/.local/bin/omarchy-launch-polkit
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/omarchy-theme-sync-all
source = ~/.config/hypr/cursor.conf
exec-once = hyprctl setcursor catppuccin-mocha-lavender-cursors 24

# Input Devices
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Window Layout and Gaps
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(24283baa)
    layout = dwindle
    allow_tearing = false
}

# Omarchy Visual Aesthetics (Rounded corners, blur, shadows, and subtle acrylic opacity)
decoration {
    rounding = 10
    dim_inactive = true
    dim_strength = 0.12
    active_opacity = 0.985
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000055)
    }
}

# Smooth Spring Animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, wind, slide
    animation = specialWorkspace, 1, 4, wind, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ==============================================================================
# Window Rules (Omarchy Signature Behaviors)
# ==============================================================================
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = pip-window
    match:title = ^(Picture.in.[Pp]icture)$
    float = true
    pin = true
    size = 600 338
    opacity = 1.0 1.0
}

windowrule {
    name = dialogs-float
    match:class = ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
    float = true
    center = true
    size = 875 600
}

windowrule {
    name = file-dialogs-float
    match:title = ^(Open.*|Save.*|Choose.*|File Upload.*)$
    float = true
    center = true
}

windowrule {
    name = media-full-opacity
    match:class = ^(com\.google\.Chrome|google-chrome|firefox|vlc|mpv|zoom|com\.obsproject\.Studio)$
    opacity = 1.0 1.0
}

# ==============================================================================
# Keybindings (Authentic Omarchy Quattro Workflow)
# ==============================================================================
$mainMod = SUPER

# Applications & Terminals
bind = $mainMod, Return, exec, alacritty
bind = $mainMod ALT, Return, exec, alacritty -e tmux new -A -s Work
bind = $mainMod SHIFT, Return, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod, B, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod SHIFT, B, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod SHIFT ALT, B, exec, ~/.local/bin/omarchy-launch-browser --incognito
bind = $mainMod, E, exec, ~/.local/bin/omarchy-launch-filemanager
bind = $mainMod SHIFT, F, exec, ~/.local/bin/omarchy-launch-filemanager
bind = $mainMod SHIFT ALT, F, exec, nautilus .
bind = $mainMod SHIFT, N, exec, alacritty -e nvim

# Web Applications & Services
bind = $mainMod SHIFT, A, exec, xdg-open https://chatgpt.com
bind = $mainMod SHIFT ALT, A, exec, xdg-open https://grok.com
bind = $mainMod SHIFT, C, exec, xdg-open https://app.hey.com/calendar/weeks/
bind = $mainMod SHIFT, E, exec, xdg-open https://app.hey.com
bind = $mainMod SHIFT ALT, E, exec, xdg-open 'https://app.hey.com/messages/new?display=standalone&new_window=true'
bind = $mainMod SHIFT, Y, exec, xdg-open https://youtube.com
bind = $mainMod SHIFT ALT, G, exec, xdg-open https://web.whatsapp.com
bind = $mainMod SHIFT CTRL, G, exec, xdg-open https://messages.google.com/web/conversations
bind = $mainMod SHIFT, P, exec, xdg-open https://photos.google.com
bind = $mainMod SHIFT, S, exec, xdg-open https://maps.google.com
bind = $mainMod SHIFT, X, exec, xdg-open https://x.com
bind = $mainMod SHIFT ALT, X, exec, xdg-open https://x.com/compose/post

# TUIs & Quick Utilities
bind = $mainMod CTRL, T, exec, alacritty -e btop
bind = $mainMod SHIFT, D, exec, alacritty -e lazygit
bind = $mainMod SHIFT ALT, M, exec, alacritty -e cliamp
bind = $mainMod CTRL, Q, exec, ~/.local/bin/omacalc
bind = $mainMod CTRL, S, exec, ~/.local/bin/omarchy-share-menu

# Omarchy Menus & Discovery
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod ALT, Space, exec, wofi --show drun
bind = $mainMod, Escape, exec, ~/.local/bin/omarchy-power-menu
bind = $mainMod, K, exec, /usr/share/omarchy/bin/omarchy-menu-keybindings
bind = $mainMod ALT, K, exec, /usr/share/omarchy/bin/omarchy-menu-tmux-keybindings
bind = $mainMod CTRL, K, exec, /usr/share/omarchy/bin/omarchy-menu-herdr-keybindings
bind = $mainMod CTRL, L, exec, swaylock -c 000000 -f
bind = $mainMod SHIFT, Space, exec, killall -SIGUSR1 waybar

# Theming, Cursor & Backgrounds
bind = $mainMod SHIFT CTRL, Space, exec, ~/.local/bin/omarchy-theme-switch
bind = $mainMod CTRL, Space, exec, omarchy theme bg next
bind = $mainMod, Backspace, exec, omarchy-hyprland-window-transparency-toggle
bind = $mainMod SHIFT, Backspace, exec, omarchy-hyprland-window-gaps-toggle

# Universal Clipboard
bind = $mainMod, V, exec, ~/.local/bin/omarchy-clipboard-menu
bind = $mainMod CTRL, V, exec, ~/.local/bin/omarchy-clipboard-menu

# Reminders
bind = $mainMod CTRL, R, exec, ~/.local/bin/omarchy-reminder-menu
bind = $mainMod CTRL ALT, R, exec, omarchy reminder show
bind = $mainMod CTRL SHIFT, R, exec, omarchy reminder clear

# Notices
bind = $mainMod CTRL ALT, T, exec, omarchy-notification-time
bind = $mainMod CTRL ALT, W, exec, ~/.local/bin/omarchy-notification-weather
bind = $mainMod CTRL ALT, B, exec, omarchy-notification-battery

# Notification Management (Mako)
bind = $mainMod, comma, exec, makoctl dismiss
bind = $mainMod SHIFT, comma, exec, makoctl dismiss -a
bind = $mainMod CTRL, comma, exec, makoctl mode -t dnd
bind = $mainMod ALT, comma, exec, makoctl invoke

# Screenshots, Recordings, Color Picker & OCR Text Extraction
bind = , Print, exec, ~/.local/bin/omarchy-screenshot region
bind = $mainMod SHIFT, S, exec, ~/.local/bin/omarchy-screenshot region
bind = ALT, Print, exec, ~/.local/bin/omarchy-screenrecord
bind = $mainMod, Print, exec, ~/.local/bin/omarchy-color-picker
bind = $mainMod CTRL, Print, exec, /usr/local/bin/omarchy-capture-text
bind = $mainMod CTRL, C, exec, ~/.local/bin/omarchy-capture-menu

# Dictionary & Text Tools
bind = $mainMod CTRL, D, exec, ~/.local/bin/omarchy-dictionary

# Dictation (Voxtype)
bind = $mainMod CTRL, X, exec, voxtype record toggle
bind = , F9, exec, voxtype record start
bindr = , F9, exec, voxtype record stop

# Window Management & Navigation
bind = $mainMod, Q, killactive
bind = $mainMod, W, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, O, togglefloating
bind = $mainMod, O, pin
bind = $mainMod, M, exit

# Window Grouping (Tabs)
bind = $mainMod, G, togglegroup
bind = $mainMod ALT, G, moveoutofgroup
bind = $mainMod ALT, Tab, changegroupactive, f
bind = $mainMod ALT SHIFT, Tab, changegroupactive, b
bind = $mainMod CTRL, Left, changegroupactive, b
bind = $mainMod CTRL, Right, changegroupactive, f

# Window Resizing
binde = $mainMod, Minus, resizeactive, -40 0
binde = $mainMod, Equal, resizeactive, 40 0
binde = $mainMod SHIFT, Minus, resizeactive, 0 -40
binde = $mainMod SHIFT, Equal, resizeactive, 0 40

# Scratchpad (Drop-down workspace)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad
bind = $mainMod ALT, S, movetoworkspace, special:scratchpad

# Audio & Media Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Switching & Cycling
bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Window Control (Move/Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

