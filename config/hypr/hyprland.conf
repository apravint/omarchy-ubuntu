# ==============================================================================
# Omarchy Hyprland Configuration
# ==============================================================================

# Monitor setup (Auto-detect)
monitor=,preferred,auto,1

# Autostart essential Daemons
exec-once = waybar
exec-once = swaybg -i ~/.local/state/omarchy/current/background -m fill
exec-once = mako
exec-once = ~/.local/bin/omarchy-launch-polkit
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/omarchy-update-waybar-theme

# Input Devices
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Window Layout and Gaps
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(24283baa)
    layout = dwindle
    allow_tearing = false
}

# Omarchy Visual Aesthetics (Rounded corners, blur, shadows, and subtle acrylic opacity)
decoration {
    rounding = 10
    dim_inactive = true
    dim_strength = 0.12
    active_opacity = 0.985
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000055)
    }
}

# Smooth Spring Animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, wind, slide
    animation = specialWorkspace, 1, 4, wind, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ==============================================================================
# Window Rules (Omarchy Signature Behaviors)
# ==============================================================================
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = pip-window
    match:title = ^(Picture.in.[Pp]icture)$
    float = true
    pin = true
    size = 600 338
    opacity = 1.0 1.0
}

windowrule {
    name = dialogs-float
    match:class = ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
    float = true
    center = true
    size = 875 600
}

windowrule {
    name = file-dialogs-float
    match:title = ^(Open.*|Save.*|Choose.*|File Upload.*)$
    float = true
    center = true
}

windowrule {
    name = media-full-opacity
    match:class = ^(com\.google\.Chrome|google-chrome|firefox|vlc|mpv|zoom|com\.obsproject\.Studio)$
    opacity = 1.0 1.0
}

# ==============================================================================
# Keybindings (Omarchy Workflow)
# ==============================================================================
$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, alacritty
bind = $mainMod SHIFT, Return, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod, B, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod SHIFT, B, exec, ~/.local/bin/omarchy-launch-browser
bind = $mainMod, E, exec, ~/.local/bin/omarchy-launch-filemanager
bind = $mainMod SHIFT, F, exec, ~/.local/bin/omarchy-launch-filemanager
bind = $mainMod SHIFT, Y, exec, xdg-open https://youtube.com
bind = $mainMod SHIFT, A, exec, xdg-open https://chatgpt.com

# Menus & Shell Controls
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, Escape, exec, ~/.local/bin/omarchy-power-menu
bind = $mainMod, V, exec, ~/.local/bin/omarchy-clipboard-menu
bind = $mainMod SHIFT CTRL, Space, exec, ~/.local/bin/omarchy-theme-switch

# Window Management
bind = $mainMod, Q, killactive
bind = $mainMod, W, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, M, exit

# Scratchpad (Hidden Slide-in Workspace)
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad
bind = $mainMod ALT, S, movetoworkspace, special:scratchpad

# Screenshots (Snipping Tool)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Audio & Media Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Window Control (Move/Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
