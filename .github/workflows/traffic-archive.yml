name: Archive GitHub Traffic & Clones

on:
  schedule:
    # Runs daily at 01:00 UTC (after midnight to collect full previous-day metrics)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-traffic:
    name: Track & Archive Clones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout traffic-data branch
        uses: actions/checkout@v4
        with:
          ref: traffic-data
          path: traffic_data

      - name: Fetch and Archive Traffic Analytics
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          OUTPUT_DIR: traffic_data
        run: |
          python scripts/archive_traffic.py

      - name: Commit and Push Traffic Archive
        run: |
          cd traffic_data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new traffic changes to commit."
          else
            git commit -m "chore(traffic): Update clone and visitor archive [$(date -u +'%Y-%m-%d')]"
            git push origin traffic-data
          fi
